<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heather Taylor | Mockup</title>
    <script type="module" src="/script.js"></script>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <!--Text Box for Course Content-->
    <div id="mainContent">
        <button class="carousel-control" id="prev">&#10094;</button>
        <button class="carousel-control" id="next">&#10095;</button>
        <div id="textArea"></div>

    </div>
  
    <!--Footer with Navigation-->
    <footer>
         <!--Help popup-->
        <div id="helpPopup">
            <div id="helpPopupContent">Use the arrows to progress with your modules</div>
        </div>

        <!--Logo leading to UFred Website-->
        <div id="footerLogoSection">
            <a href="https://ufred.ca" id="footerLogoLink">
                <img id="footerLogo" class="footerImg" src="./assets/images/ufred_logo.svg"></img>
            </a>   
        </div>
        
        <!--Title and Module number of displayed content-->
        <div id="footerModuleTitle"></div>

        <!--Footer naviation items-->
        <div id="footerNavigation">
            <button id="slideMenuButton" class="footerButton"><img id="footerMenu" class="footerImg" src="./assets/images/menu_icon.svg"></img></button>
            <button id="linksButton" class="footerButton"><img id="footerLinks" class="footerImg" src="./assets/images/links_icon.svg"></img></button>
            <button id="helpButton" class="footerButton"><img id="footerHelp" class="footerImg" src="./assets/images/help_icon.svg"></img></button>
        </div>
    </footer>

    <!--Menu that slides out with push of menu button-->
    <div id="slideMenu">
        <ul id="slideMenuSelect">
            <li class="slideMenuItem"><a class="slideLink" href="https://ufred.ca">Home</a></li>
            <li class="slideMenuItem"><a class="slideLink" href="https://www.linkedin.com/school/university-of-fredericton/">LinkedIn</a></li>
        </ul>
    </div>
</body>
</html>
